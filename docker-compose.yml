# docker-compose.yml - Development Environment
services:
  # -------------------------------------------
  # PostgreSQL Database
  # -------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: schizophrenia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schizophrenia_ai}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-schizophrenia_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - schizophrenia-network
    restart: unless-stopped

  # -------------------------------------------
  # Redis (Job Queue & Caching)
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: schizophrenia-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - schizophrenia-network
    restart: unless-stopped

  # -------------------------------------------
  # Backend API (Node.js/Express)
  # -------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: development
    container_name: schizophrenia-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-schizophrenia_ai}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      BACKEND_API_PREFIX: ${BACKEND_API_PREFIX:-/api}
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-http://localhost:5173}
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-2048}
      UPLOAD_STORAGE_PATH: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - schizophrenia-network
    restart: unless-stopped
    command: npm run dev

  # -------------------------------------------
  # AI Service (FastAPI)
  # -------------------------------------------
  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service.Dockerfile
      target: development
    container_name: schizophrenia-ai-service
    environment:
      PYTHON_ENV: development
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /app/models
      CACHE_DIR: /app/cache
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      MAX_VRAM_GB: ${MAX_VRAM_GB:-5.5}
      USE_MIXED_PRECISION: ${USE_MIXED_PRECISION:-true}
      USE_GRADIENT_CHECKPOINTING: ${USE_GRADIENT_CHECKPOINTING:-true}
      USE_TORCH_COMPILE: ${USE_TORCH_COMPILE:-true}
      USE_FLASH_ATTENTION: ${USE_FLASH_ATTENTION:-true}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Preprocessing defaults
      EEG_TARGET_SR: ${EEG_TARGET_SR:-250}
      EEG_L_FREQ: ${EEG_L_FREQ:-0.5}
      EEG_H_FREQ: ${EEG_H_FREQ:-100}
      EEG_NOTCH_FREQ: ${EEG_NOTCH_FREQ:-50}
      SMRI_TEMPLATE: ${SMRI_TEMPLATE:-MNI152_1mm}
      SMRI_PATCH_SIZE: ${SMRI_PATCH_SIZE:-64}
      SMRI_PATCH_STRIDE: ${SMRI_PATCH_STRIDE:-32}
      FMRI_TR: ${FMRI_TR:-2.0}
      FMRI_PARCELLATION: ${FMRI_PARCELLATION:-schaefer_200}
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
      - ./models:/app/models:ro
      - ./datasets:/data:ro
      - ./ai-service/cache:/app/cache
      - ./uploads:/app/uploads:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - schizophrenia-network
    restart: unless-stopped
    # CPU-only by default (Phase 1: no ML frameworks installed).
    # For GPU use on machines with the NVIDIA Container Toolkit, start with:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up ai-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app

  # -------------------------------------------
  # Frontend (React/Vite)
  # -------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    container_name: schizophrenia-frontend
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
      VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-http://localhost:8000}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Schizophrenia AI Platform}
      VITE_DISCLAIMER_TEXT: ${VITE_DISCLAIMER_TEXT:-Research prototype - not for clinical diagnosis. Clinician review required.}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - schizophrenia-network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173

  # -------------------------------------------
  # Nginx Reverse Proxy (Optional - for production-like testing)
  # -------------------------------------------
  # nginx:
  #   build:
  #     context: .
  #     dockerfile: docker/nginx.Dockerfile
  #   container_name: schizophrenia-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./docker/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #     - ai-service
  #   networks:
  #     - schizophrenia-network
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  schizophrenia-network:
    driver: bridge
    name: schizophrenia-network